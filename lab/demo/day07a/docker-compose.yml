# Day 07a — LiteLLM proxy as a standalone gateway service
# Start:  docker compose up -d
# Logs:   docker compose logs -f litellm
# Stop:   docker compose down

services:

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: day07a-litellm
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-day07a-local}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
