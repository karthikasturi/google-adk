# Day 12 — PromptFoo eval via Docker (self-contained)
#
# Three usable commands — no manual host steps:
#
#   docker compose run --rm promptfoo        # run the eval (default)
#   docker compose run --rm promptfoo view   # ad-hoc: any promptfoo subcommand
#   docker compose up viewer                 # results UI at http://localhost:15500
#                                            # (Ctrl-C then `docker compose down`)
#
# Services:
#   - agent:     the real ADK TravelBot behind an HTTP server (agent.Dockerfile;
#                day12 code is mounted, not copied)
#   - promptfoo: the official promptfoo image, runs the eval against the agent
#   - viewer:    the promptfoo results UI (same image), reads persisted results
#
# Key points (these fix two earlier footguns):
#   - entrypoint is `promptfoo`, so `docker compose run --rm promptfoo <args>`
#     passes <args> straight to the CLI. Without this, `run ... view` replaced
#     the whole command and the image's wrapper ran `node view` →
#     "Cannot find module '/work/view'".
#   - eval results live in the `promptfoo-data` named volume mounted at the
#     container user's own config dir (/home/promptfoo/.promptfoo), so they
#     persist and the `viewer` service can read what `promptfoo` wrote. (A host
#     bind mount there fails: the non-root container user can't write it.)

services:
  agent:
    build:
      context: ..
      dockerfile: promptfoo/agent.Dockerfile
    image: day12-agent:latest
    working_dir: /day12
    volumes:
      - ..:/day12
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8930/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The agent imports google-adk + litellm before it can serve, which takes
      # ~25s (longer on a cold/slow machine). A generous start_period keeps it
      # in "starting" (not "unhealthy") during that import, so promptfoo's
      # depends_on doesn't fail with "container ... is unhealthy".
      start_period: 90s

  promptfoo:
    image: ghcr.io/promptfoo/promptfoo:latest
    entrypoint: ["promptfoo"]
    working_dir: /work
    volumes:
      - .:/work
      - promptfoo-data:/home/promptfoo/.promptfoo
    env_file:
      - ../.env
    depends_on:
      agent:
        condition: service_healthy
    restart: "no"
    command: ["eval", "-c", "promptfooconfig.docker.yaml", "--no-progress-bar"]

  # Results UI. Run AFTER an eval: `docker compose up viewer` → localhost:15500
  viewer:
    image: ghcr.io/promptfoo/promptfoo:latest
    entrypoint: ["promptfoo"]
    working_dir: /work
    volumes:
      - .:/work
      - promptfoo-data:/home/promptfoo/.promptfoo
    env_file:
      - ../.env
    ports:
      - "15500:15500"
    command: ["view", "-y", "--port", "15500"]

volumes:
  promptfoo-data:
